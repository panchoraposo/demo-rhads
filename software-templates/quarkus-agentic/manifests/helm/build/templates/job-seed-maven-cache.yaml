{{- if eq .Values.build.language "maven" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rhads-build.name" . }}-seed-m2
  labels:
    {{- include "rhads-build.labels" . | nindent 4 }}
    app.kubernetes.io/component: maven-cache
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pipeline
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: seed
          image: registry.access.redhat.com/ubi9/ubi:9.6
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              REPO=/cache/repository
              mkdir -p "${REPO}"
              if [ -f "${REPO}/.rhads-seeded" ]; then
                echo "Maven cache already seeded ($(du -sh "${REPO}" | awk '{print $1}'))"
                exit 0
              fi
              SEED_URL="${MAVEN_SEED_URL:-http://nexus.nexus.svc:8081/repository/raw-hosted/rhads/m2-seed.tar.gz}"
              echo "Waiting for Nexus m2 seed at ${SEED_URL}"
              for i in $(seq 1 80); do
                if curl -sf --max-time 30 -o /tmp/m2-seed.tar.gz "${SEED_URL}"; then
                  echo "Extracting seed ($(ls -lh /tmp/m2-seed.tar.gz | awk '{print $5}'))"
                  tar -xzf /tmp/m2-seed.tar.gz -C "${REPO}"
                  touch "${REPO}/.rhads-seeded"
                  echo "PASS: seeded Maven cache $(du -sh "${REPO}" | awk '{print $1}')"
                  exit 0
                fi
                echo "seed not ready (${i}/80)"
                sleep 15
              done
              echo "WARN: m2-seed.tar.gz missing; PVC is bound. Job rhads-maven-warm must publish the seed."
              exit 0
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "rhads-build.name" . }}-build-cache
{{- end }}
