apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rhads-build.name" . }}-copy-secrets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 8
  template:
    spec:
      serviceAccountName: pipeline
      restartPolicy: OnFailure
      containers:
        - name: copy
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              copy_obj() {
                local kind="$1" name="$2"
                oc -n rhads-ci get "$kind" "$name" -o jsonpath='{.metadata.name}' >/dev/null 2>&1 || return 0
                oc extract "$kind/$name" --to="/tmp/${kind}-${name}" -n rhads-ci --confirm >/dev/null
                if [ "$kind" = secret ]; then
                  TYPE="$(oc get secret "$name" -n rhads-ci -o jsonpath='{.type}')"
                  oc create secret generic "$name" -n "$NS" --type="$TYPE" \
                    --from-file="/tmp/${kind}-${name}" --dry-run=client -o yaml | oc apply -f -
                else
                  oc create configmap "$name" -n "$NS" \
                    --from-file="/tmp/${kind}-${name}" --dry-run=client -o yaml | oc apply -f -
                fi
              }
              for s in cosign-signing-key acs-ci tpa-oidc rhads-pipeline-env quay-dockerconfig gitlab-token; do
                copy_obj secret "$s"
              done
              copy_obj configmap rhads-conforma-policy || true
              copy_obj configmap rhads-maven-settings || true
              oc -n "$NS" secrets link pipeline quay-dockerconfig --for=pull,mount 2>/dev/null || true


