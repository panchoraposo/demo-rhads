---
openapi: 3.0.3
info:
  title: ${{values.component_id}} API
  version: 1.0-SNAPSHOT
  description: Miles of Smiles HITL car-return workflow
paths:
  /cars:
    get:
      summary: List cars
      responses:
        "200":
          description: OK
  /car-management/return/{id}:
    post:
      summary: Start a car return (202). HITL is polled via /api/approvals/pending.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Workflow started; body is { car, workflow } (action=PROCESSING). Poll /cars and /api/approvals/pending.
  /approvals:
    get:
      summary: Pending HITL proposals
      responses:
        "200":
          description: OK
  /q/health:
    get:
      summary: Health
      responses:
        "200":
          description: OK
