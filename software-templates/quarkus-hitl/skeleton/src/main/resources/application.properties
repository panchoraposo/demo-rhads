# ${{values.component_id}} — Miles of Smiles HITL (Quarkus 3.33 + MaaS)
quarkus.application.name=${{values.component_id}}
quarkus.application.version=1.0-SNAPSHOT
quarkus.http.port=${{values.port}}
quarkus.http.host=0.0.0.0
quarkus.banner.enabled=true
# HITL can pause the HTTP request until a human decides (up to 5 minutes).
quarkus.http.idle-timeout=10M
quarkus.transaction-manager.default-transaction-timeout=300s

# H2 in-memory: every new JVM (every deploy / Recreate) drops schema and reloads import.sql.
# HITL proposals live in the same JVM; a rollout resets the fleet and pending approvals.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:miles;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,YEAR,CONDITION
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.smallrye-openapi.info-title=Miles of Smiles — Human-in-the-Loop
quarkus.smallrye-openapi.info-description=${{values.description}}
quarkus.smallrye-openapi.info-version=3.33.3
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
car-management.approval.threshold=15000

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.console.charset=UTF-8
quarkus.log.category."com.carmanagement".level=INFO
%dev.quarkus.log.category."dev.langchain4j.agentic".level=WARN
%dev.quarkus.log.category."dev.langchain4j.agentic.supervisor".level=WARN

quarkus.http.static-resources.caching-enabled=false
# /.*/ (not /./): browsers send Origin on POST even for same-origin fetch.
# /./ only matches a one-character origin, so Return was 403 in the cluster UI.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,HEAD,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin

# Dev Spaces reverse-proxy (Dev UI + live reload).
%dev.quarkus.http.host=0.0.0.0
%dev.quarkus.http.port=8080
%dev.quarkus.live-reload.instrumentation=true
%dev.quarkus.http.proxy.proxy-address-forwarding=true
%dev.quarkus.http.proxy.allow-x-forwarded=true
%dev.quarkus.http.proxy.enable-forwarded-host=true
%dev.quarkus.http.proxy.enable-forwarded-prefix=true
# Quarkus 3.15+ LocalHostOnlyFilter blocks Dev UI unless the Host matches.
# Dev Spaces exposes the app as https://devspaces.apps.<cluster>/…/8080/q/dev-ui
%dev.quarkus.dev-ui.hosts=^devspaces\\.apps\\..*$
# Dev UI CORS still defaults to localhost-only and blanks the UI behind the proxy.
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.http.cors.access-control-allow-credentials=true
%dev.quarkus.test.continuous-testing=disabled
quarkus.analytics.disabled=true

# ---------------------------------------------------------------------------
# LLM — Red Hat MaaS (OpenAI-compatible). Timeouts 300s so Qwen3 is not cut off.
# Dev Spaces: Command palette → Quarkus dev. Set MAAS_API_KEY in .env if empty.
# Optional: -Dquarkus.profile=ollama | openai
# ---------------------------------------------------------------------------
demo.llm.label=MaaS ${MAAS_MODEL:${{values.maas_model}}}
demo.llm.disable-thinking=true

quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.enable-integration=true
quarkus.langchain4j.openai.base-url=${MAAS_BASE_URL:${{values.maas_base_url}}}
quarkus.langchain4j.openai.api-key=${MAAS_API_KEY:}
quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL:${{values.maas_model}}}
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.chat-model.max-completion-tokens=512
quarkus.langchain4j.openai.timeout=300s
quarkus.langchain4j.openai.max-retries=4
quarkus.rest-client.connect-timeout=30000
quarkus.rest-client.read-timeout=300000
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.langchain4j.ollama.enable-integration=false
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.enabled=false

%maas.demo.llm.label=MaaS ${MAAS_MODEL:${{values.maas_model}}}
%maas.demo.llm.disable-thinking=true
%maas.quarkus.langchain4j.chat-model.provider=openai
%maas.quarkus.langchain4j.openai.enable-integration=true
%maas.quarkus.langchain4j.openai.base-url=${MAAS_BASE_URL:${{values.maas_base_url}}}
%maas.quarkus.langchain4j.openai.api-key=${MAAS_API_KEY:}
%maas.quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL:${{values.maas_model}}}
%maas.quarkus.langchain4j.openai.timeout=300s
%maas.quarkus.langchain4j.ollama.enable-integration=false
%maas.quarkus.langchain4j.devservices.enabled=false

quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:llama3.2}
quarkus.langchain4j.ollama.timeout=180s
quarkus.langchain4j.ollama.embedding-model.enabled=false

%ollama.demo.llm.label=Ollama ${OLLAMA_MODEL:llama3.2} (local)
%ollama.demo.llm.disable-thinking=false
%ollama.quarkus.langchain4j.chat-model.provider=ollama
%ollama.quarkus.langchain4j.ollama.enable-integration=true
%ollama.quarkus.langchain4j.ollama.devservices.enabled=${OLLAMA_DEVSERVICES:false}
%ollama.quarkus.langchain4j.openai.enable-integration=false

%openai.demo.llm.label=OpenAI ${OPENAI_MODEL:gpt-4o-mini}
%openai.quarkus.langchain4j.chat-model.provider=openai
%openai.quarkus.langchain4j.openai.enable-integration=true
%openai.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
%openai.quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-4o-mini}
%openai.quarkus.langchain4j.ollama.enable-integration=false
%openai.quarkus.langchain4j.devservices.enabled=false
