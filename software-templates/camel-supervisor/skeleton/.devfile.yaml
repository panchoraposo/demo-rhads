schemaVersion: 2.2.0
metadata:
  name: ${{values.component_id}}
  displayName: ${{values.component_id}}
  description: ${{values.description}}
  tags: [Java, Camel, Kaoto, JBang, MaaS]
  projectType: camel
# Che Code lists devfile commands only when the devfile declares the Git project
# (see eclipse-che/che#23479). Do not use per-user devfile storage here — it can
# leave the Tasks > devfile list empty until you restart from the repo copy.
projects:
  - name: ${{values.component_id}}
    git:
      remotes:
        origin: https://${{values.host}}/${{values.destination}}
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 10Gi
      memoryRequest: 2Gi
      cpuLimit: "6"
      cpuRequest: "1"
      mountSources: true
      command:
        - /bin/bash
        - -c
        - |
          mkdir -p /home/user/.m2 /home/user/.jbang/bin
          (
            if [ ! -f /home/user/.m2/.rhads-seeded ]; then
              curl -fsS --retry 8 --max-time 180 \
                http://nexus.nexus.svc:8081/repository/raw-hosted/rhads/m2-seed.tar.gz \
                | tar -xz -C /home/user/.m2 \
                && touch /home/user/.m2/.rhads-seeded
            fi
          ) >/tmp/rhads-m2-seed.log 2>&1 &
          exec sleep infinity
      endpoints:
        # Public discoverable routes on 8080 block "Preparing services" until
        # Camel listens. Keep one public UI; Dev UI is internal (same port).
        - name: camel-ui
          targetPort: 8080
          exposure: public
          protocol: https
          path: /
          attributes:
            discoverable: "false"
            cookiesAuthEnabled: "true"
            urlRewriteSupported: "true"
        - name: camel-devui
          targetPort: 8080
          exposure: internal
          protocol: https
          path: /q/dev
          attributes:
            discoverable: "false"
            cookiesAuthEnabled: "true"
            urlRewriteSupported: "true"
      env:
        - name: MAVEN_OPTS
          value: "-Xmx2g"
        - name: CAMEL_VERSION
          value: "4.18.3"
        - name: MAAS_BASE_URL
          value: ${{values.maas_base_url | dump}}
        - name: MAAS_MODEL
          value: ${{values.maas_model | dump}}
        - name: MAAS_API_KEY
          value: ${{values.maas_api_key | dump}}
        - name: GITSIGN_FULCIO_URL
          value: https://fulcio-server-trusted-artifact-signer.${{values.cluster_subdomain}}
        - name: GITSIGN_REKOR_URL
          value: https://rekor-server-trusted-artifact-signer.${{values.cluster_subdomain}}
        - name: GITSIGN_OIDC_ISSUER
          value: https://sso.${{values.cluster_subdomain}}/realms/backstage
        - name: GITSIGN_OIDC_CLIENT_ID
          value: trusted-artifact-signer
        - name: GITSIGN_TUF_URL
          value: https://tuf-trusted-artifact-signer.${{values.cluster_subdomain}}
        - name: GITSIGN_CERT_IDENTITY
          value: dev1@rhads.demo
        - name: CLUSTER_SUBDOMAIN
          value: ${{values.cluster_subdomain}}
commands:
  - id: install-camel
    exec:
      label: Install JBang + Camel CLI
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: bash scripts/install-camel-cli.sh
      group:
        kind: build
        isDefault: true
  - id: setup-maas
    exec:
      label: Write .env for Red Hat MaaS
      component: tools
      commandLine: bash .devcontainer/setup-maas.sh
      workingDir: ${PROJECT_SOURCE}
  - id: run-maas
    exec:
      label: Camel JBang + MaaS (fleet UI on 8080)
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: bash -c 'export PATH="$HOME/.jbang/bin:$PATH"; unset DISPLAY; export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true${JAVA_TOOL_OPTIONS:+ ${JAVA_TOOL_OPTIONS}}"; bash .devcontainer/setup-maas.sh; ./scripts/run-maas.sh'
      group:
        kind: run
        isDefault: true
  - id: open-kaoto
    exec:
      label: Open Kaoto canvas (03-workflow.camel.yaml)
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: echo "Open integrations/03-workflow.camel.yaml and run Kaoto (right-click → Open with Kaoto, or command palette → Kaoto)."
  - id: setup-gitsign
    exec:
      label: Configure Sigstore git commit signing (gitsign + RHTAS TUF)
      component: tools
      commandLine: bash .devcontainer/setup-gitsign.sh
      workingDir: ${PROJECT_SOURCE}
  - id: verify-gitsign
    exec:
      label: Verify Sigstore-signed HEAD (gitsign + RHTAS TUF)
      component: tools
      commandLine: bash .devcontainer/verify-gitsign.sh
      workingDir: ${PROJECT_SOURCE}
  - id: package
    exec:
      label: Maven package (Nexus) — cluster image
      component: tools
      commandLine: ./mvnw -s .mvn/settings.xml -DskipTests package
      workingDir: ${PROJECT_SOURCE}
# No postStart: JBang/Camel install blocks the IDE. Palette → Install JBang + Camel CLI
# (or run-maas.sh calls ensure_camel_cli).
