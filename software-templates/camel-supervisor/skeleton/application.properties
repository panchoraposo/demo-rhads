# Camel JBang (Dev Spaces). Cluster image uses src/main/resources/application.properties.
camel.jbang.camel-version=4.18.3
camel.main.name=${{values.component_id}}
camel.main.routesReloadEnabled=true
camel.main.additionalSensitiveKeywords=ai.api-key,AI_API_KEY,MAAS_API_KEY

camel.server.enabled=true
camel.server.port=8080
camel.server.staticEnabled=true
camel.server.staticSourceDir=www

ai.base-url=${AI_BASE_URL:${MAAS_BASE_URL:http://localhost:11434/v1}}
ai.api-key=${AI_API_KEY:${MAAS_API_KEY:ollama}}
ai.model=${AI_MODEL:${MAAS_MODEL:qwen3-14b}}

camel.component.openai.base-url={{ai.base-url}}
camel.component.openai.api-key={{ai.api-key}}
camel.component.openai.model={{ai.model}}
