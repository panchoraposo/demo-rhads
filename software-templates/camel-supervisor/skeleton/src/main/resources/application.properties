# Camel Quarkus (cluster image). Same OpenAI + YAML routes as Camel JBang.
quarkus.application.name=${{values.component_id}}
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.idle-timeout=2M
quarkus.vertx.max-event-loop-execute-time=120s
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,HEAD,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.smallrye-health.root-path=/q/health
quarkus.log.console.charset=UTF-8
quarkus.native.file-encoding=UTF-8
quarkus.arc.unremovable-types=com.carmanagement.quarkus.QuarkusCamelBeans

camel.main.routes-include-pattern=classpath:camel/*.yaml
camel.main.name=${{values.component_id}}

ai.base-url=${MAAS_BASE_URL:${{values.maas_base_url}}}
ai.api-key=${MAAS_API_KEY:}
ai.model=${MAAS_MODEL:${{values.maas_model}}}

camel.component.openai.base-url=${MAAS_BASE_URL:${{values.maas_base_url}}}
camel.component.openai.api-key=${MAAS_API_KEY:}
camel.component.openai.model=${MAAS_MODEL:${{values.maas_model}}}
