apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhads-gitsign-verify
  namespace: rhads-ci
  labels:
    app.kubernetes.io/part-of: rhads-demo
spec:
  params:
    - name: REKOR_URL
      type: string
    - name: FULCIO_URL
      type: string
  workspaces:
    - name: source
  steps:
    - name: verify
      image: registry.redhat.io/rhtas/gitsign-rhel9@sha256:4f95c088ef66165779e4b2d5ba89cf2594dd0d837bb707350712dc13b8a27c90
      env:
        - name: GITSIGN_REKOR_URL
          value: $(params.REKOR_URL)
        - name: GITSIGN_FULCIO_URL
          value: $(params.FULCIO_URL)
      securityContext:
        runAsUser: 0
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "============================================================"
        echo "[SSSC] Verify Sigstore commit signature"
        echo "Control: gitsign (RHTAS) — same Fulcio/Rekor trust root as cosign"
        echo "Fulcio: ${GITSIGN_FULCIO_URL}"
        echo "Rekor:  ${GITSIGN_REKOR_URL}"
        echo "============================================================"
        export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
        GITSIGN_BIN="/usr/local/bin/gitsign_cli_linux"
        if [ ! -x "${GITSIGN_BIN}" ]; then
          GITSIGN_BIN="$(command -v gitsign || true)"
        fi
        if ! command -v git >/dev/null 2>&1; then
          echo "Installing git-core (RHTAS gitsign image ships gitsign_cli_linux, not git)..."
          microdnf -y install git-core >/dev/null
        fi
        git config --global --add safe.directory '*'
        echo "tools: git=$(git --version | awk '{print $3}') gitsign=${GITSIGN_BIN}"
        cd "$(workspaces.source.path)"
        echo
        echo "--- HEAD commit ---"
        git log -1 --pretty=full
        echo
        echo "--- gitsign verify HEAD ---"
        set +e
        "${GITSIGN_BIN}" verify HEAD
        rc=$?
        set -e
        if [ "${rc}" -eq 0 ]; then
          echo
          echo "PASS: commit is Sigstore-signed (Fulcio identity recorded in Rekor)."
          echo "This is the developer signature from Dev Spaces (gitsign / same trust root as cosign)."
          exit 0
        fi
        echo
        echo "WARN: commit is NOT gitsign-signed (exit ${rc})."
        echo "The scaffolded initial commit is unsigned. The live demo signs the"
        echo "follow-up commit from OpenShift Dev Spaces (git commit with gitsign)."
        git log -1 --show-signature || true
        echo "PASS: verification ran; unsigned initial commits do not fail the pipeline."
