apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhads-update-gitops
  namespace: rhads-ci
  labels:
    app.kubernetes.io/part-of: rhads-demo
spec:
  params:
    - name: GITOPS_REPO
      type: string
    - name: GITOPS_REVISION
      type: string
      default: main
    - name: IMAGE
      type: string
    - name: IMAGE_TAG
      type: string
    - name: OVERLAY
      type: string
      description: Environment overlay directory (dev, staging, prod)
    - name: COMPONENT
      type: string
  workspaces:
    - name: source
  steps:
    - name: bump-tag
      image: registry.access.redhat.com/ubi9/ubi:9.6
      env:
        - name: GITOPS_REPO
          value: $(params.GITOPS_REPO)
        - name: GITOPS_REVISION
          value: $(params.GITOPS_REVISION)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: OVERLAY
          value: $(params.OVERLAY)
        - name: COMPONENT
          value: $(params.COMPONENT)
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitlab-token
              key: token
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "============================================================"
        echo "[SSSC] GitOps promotion (${OVERLAY})"
        echo "Control: only this pipeline writes the image digest into the GitOps repo;"
        echo "         Argo CD then reconciles the environment. Humans promote via GitLab"
        echo "         tag (staging) or release (prod), not by editing cluster YAML."
        echo "Overlay: ${OVERLAY}"
        echo "Image:   ${IMAGE}"
        echo "Tag:     ${IMAGE_TAG}"
        echo "GitOps:  ${GITOPS_REPO}"
        echo "============================================================"
        if ! command -v git >/dev/null 2>&1; then
          echo "Installing git-core (UBI does not ship git)..."
          dnf -y install git-core >/dev/null
        fi
        echo "tools: git=$(git --version | awk '{print $3}')"
        git config --global user.email "pipelines@rhads.demo"
        git config --global user.name "RHADS Pipelines"
        git config --global http.sslVerify false
        DEST="$(workspaces.source.path)/gitops"
        AUTH_REPO="${GITOPS_REPO}"
        if [ -n "${GIT_TOKEN:-}" ]; then
          AUTH_REPO="$(echo "${GITOPS_REPO}" | sed "s#https://#https://oauth2:${GIT_TOKEN}@#")"
        else
          echo "FAIL: gitlab-token secret is missing; cannot push GitOps" >&2
          exit 1
        fi
        rm -rf "${DEST}"
        git clone --branch "${GITOPS_REVISION}" "${AUTH_REPO}" "${DEST}"
        FILE="${DEST}/overlays/${OVERLAY}/kustomization.yaml"
        if [ ! -f "${FILE}" ]; then
          FILE="${DEST}/helm/app/values-${OVERLAY}.yaml"
        fi
        if [ ! -f "${FILE}" ]; then
          echo "No overlay file found, writing values-${OVERLAY}.yaml"
          mkdir -p "${DEST}/helm/app"
          FILE="${DEST}/helm/app/values-${OVERLAY}.yaml"
        fi
        echo "--- writing ${FILE} ---"
        cat > "${FILE}" <<EOF
        image:
          tag: "${IMAGE_TAG}"
          digestRef: "${IMAGE}"
        environment: "${OVERLAY}"
        EOF
        cat "${FILE}"
        cd "${DEST}"
        git add -A
        if git diff --cached --quiet; then
          echo "PASS: GitOps already points at ${IMAGE} (${OVERLAY})"
          exit 0
        fi
        git commit -m "promote ${COMPONENT} to ${OVERLAY} tag ${IMAGE_TAG}"
        git push origin "HEAD:${GITOPS_REVISION}"
        echo
        echo "PASS: GitOps ${OVERLAY} now references ${IMAGE}. Argo CD will sync the namespace."
