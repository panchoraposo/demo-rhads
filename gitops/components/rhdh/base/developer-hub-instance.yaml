apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  application:
    extraEnvs:
      secrets:
        - name: backstage-env
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rbac-policies
        - name: catalog-static
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: developer-hub-config
    route:
      enabled: true
  database:
    enableLocalDb: true
