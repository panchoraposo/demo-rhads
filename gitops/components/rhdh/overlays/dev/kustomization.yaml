apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backstage
resources:
  - ../../base
  - dynamic-plugins-rhdh.yaml
  - rbac-policy.yaml
  - catalog-static.yaml

configMapGenerator:
  - name: developer-hub-config
    files:
      - app-config.yaml
    options:
      disableNameSuffixHash: true

generatorOptions:
  disableNameSuffixHash: true
