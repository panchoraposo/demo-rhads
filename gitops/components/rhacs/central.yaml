apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  central:
    exposure:
      route:
        enabled: true
    # Dedicated workers only: control-planes also have the worker label, and RBD
    # on some nodes leaves a stale Postgres lock after reboot.
    nodeSelector:
      kubernetes.io/hostname: worker-cluster-bd774-3
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    db:
      nodeSelector:
        kubernetes.io/hostname: worker-cluster-bd774-1
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
  scanner:
    analyzer:
      nodeSelector:
        kubernetes.io/hostname: worker-cluster-bd774-1
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1500Mi
        limits:
          cpu: "2"
          memory: 4Gi
    scannerComponent: Enabled
  scannerV4:
    scannerComponent: Disabled
