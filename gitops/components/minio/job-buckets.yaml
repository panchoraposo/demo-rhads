apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /tmp/.mc
              until mc alias set local http://minio.minio.svc:9000 minio minio12345678; do
                echo "waiting for minio..."
                sleep 5
              done
              mc mb --ignore-existing local/quay
              mc mb --ignore-existing local/trustify
              mc anonymous set none local/quay || true
              echo "buckets ready"
