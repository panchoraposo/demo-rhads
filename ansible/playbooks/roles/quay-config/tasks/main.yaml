---
- name: Wait for ODF Multicloud Object Gateway (NooBaa)
  kubernetes.core.k8s_info:
    api_version: noobaa.io/v1alpha1
    kind: NooBaa
    name: noobaa
    namespace: openshift-storage
  register: noobaa
  until: >
    noobaa.resources | default([]) | length > 0 and
    (noobaa.resources[0].status.phase | default('') | lower) in ['ready', 'connected']
  retries: 80
  delay: 20

- name: Create Quay config bundle
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'quay-config-bundle.yaml.j2') | from_yaml }}"

- name: Create QuayRegistry
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'quayregistry.yaml.j2') | from_yaml }}"

- name: Wait for Quay application route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: quay-quay
    namespace: "{{ quay_namespace }}"
  register: quay_app_route
  until: quay_app_route.resources | default([]) | length > 0
  retries: 40
  delay: 15

- name: Set Quay URL
  ansible.builtin.set_fact:
    quay_url: "{{ quay_app_route.resources[0].spec.host }}"
    quay_host: "{{ quay_app_route.resources[0].spec.host }}"

- name: Wait for QuayRegistry Available
  kubernetes.core.k8s_info:
    api_version: quay.redhat.com/v1
    kind: QuayRegistry
    name: quay
    namespace: "{{ quay_namespace }}"
  register: quay_status
  until: >
    quay_status.resources | length > 0 and
    quay_status.resources[0].status.conditions is defined and
    (quay_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Available') | list | length > 0) and
    (quay_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Available') | list)[0].status == 'True'
  retries: 80
  delay: 20

- name: Initialize Quay superuser
  ansible.builtin.uri:
    url: "https://{{ quay_url }}/api/v1/user/initialize"
    method: POST
    validate_certs: false
    follow_redirects: all
    body_format: json
    body:
      username: "{{ quay_admin_user }}"
      password: "{{ quay_admin_password }}"
      email: "{{ quay_org_email }}"
      access_token: true
    status_code: [200, 201, 400, 409]
  register: init_user_result
  retries: 30
  delay: 15

- name: Persist Quay admin token when initialize returns one
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: quay-admin-token
        namespace: "{{ quay_namespace }}"
      type: Opaque
      stringData:
        token: "{{ init_user_result.json.access_token }}"
  when: init_user_result.json.access_token | default('') | length > 0

- name: Read stored Quay admin token
  kubernetes.core.k8s_info:
    kind: Secret
    name: quay-admin-token
    namespace: "{{ quay_namespace }}"
  register: quay_token_secret
  when: init_user_result.json.access_token | default('') | length == 0

- name: Capture Quay token from initialize
  ansible.builtin.set_fact:
    quay_api_token: "{{ init_user_result.json.access_token | default('') }}"

- name: Capture Quay token from stored secret
  ansible.builtin.set_fact:
    quay_api_token: "{{ quay_token_secret.resources[0].data.token | b64decode }}"
  when:
    - quay_api_token | length == 0
    - quay_token_secret.resources | default([]) | length > 0

- name: Create organization
  ansible.builtin.uri:
    url: "https://{{ quay_url }}/api/v1/organization/"
    method: POST
    validate_certs: false
    follow_redirects: all
    headers:
      Authorization: "Bearer {{ quay_api_token }}"
    body_format: json
    body:
      name: "{{ quay_org }}"
      email: "{{ quay_org }}@rhads.demo"
    status_code: [200, 201, 400, 409]
  when: quay_api_token | length > 0

- name: Create robot account
  ansible.builtin.uri:
    url: "https://{{ quay_url }}/api/v1/organization/{{ quay_org }}/robots/{{ quay_robot_name }}"
    method: PUT
    validate_certs: false
    follow_redirects: all
    headers:
      Authorization: "Bearer {{ quay_api_token }}"
    body_format: json
    body: {}
    status_code: [200, 201, 400]
  register: robot_account
  when: quay_api_token | length > 0

- name: Save robot token
  ansible.builtin.set_fact:
    quay_robot_username: "{{ robot_account.json.name | default(quay_org + '+' + quay_robot_name) }}"
    quay_robot_token: "{{ robot_account.json.token | default('') }}"
  when: robot_account is not skipped

- name: Create dockerconfig secret in rhads-ci
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: quay-dockerconfig
        namespace: rhads-ci
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ quay_url }}": {
                "username": "{{ quay_robot_username | default('quayadmin') }}",
                "password": "{{ quay_robot_token | default(quay_admin_password) }}"
              }
            }
          }
  when: quay_url is defined

- name: Re-publish platform repo with the live Quay hostname
  ansible.builtin.include_role:
    name: gitlab-config
    tasks_from: publish-platform-repo.yaml
